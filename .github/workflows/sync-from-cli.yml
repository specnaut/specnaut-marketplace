# Publish the marketplace catalogs of the latest specnaut-cli release.
#
# The direction is deliberate. specnaut-cli — a PUBLIC repository — used to hold
# a fine-grained PAT with write access here and bump the catalog at release
# time. A repository publishing a release should not need write access to
# everything that lists it, and the credential enabling that should not sit in a
# public repo at all.
#
# specnaut-cli's Releases API needs no authentication, because the repository is
# public. This workflow reads it and commits to ITSELF with the run's own
# GITHUB_TOKEN, scoped here and expiring with the job. No secret is stored in
# either repo.
#
# The cost is latency: a release lands here within the cron interval rather than
# within seconds. `workflow_dispatch` covers the case where that matters.
name: sync from specnaut-cli

on:
  # Hourly, not every fifteen minutes. This is a SAFETY NET — the release
  # session dispatches both syncs the moment a release lands, so the cron only
  # covers the case where that did not happen. At */15 it produced ~96 no-op
  # runs a day per target, and an Actions history that is 99% "nothing to do"
  # is one where a real failure scrolls past unnoticed.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-cli
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pinned: this job's token can repoint what every user installs. And the
      # branch tip, not the trigger-time commit: a cron run queued behind a
      # dispatch would otherwise push from a stale base and fail red.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Copy the catalogs published at the latest specnaut-cli release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPSTREAM="specnaut/specnaut-cli"
          # Each catalog lives in specnaut-cli beside the plugins it lists, and is
          # copied here VERBATIM at the release tag. Two files, one per installer
          # dialect: Claude Code reads .claude-plugin/ and needs `git-subdir`;
          # Copilot CLI reads .github/plugin/ first and needs `github` + `path`.
          #
          # The previous version of this step patched a `version` field in a
          # catalog written by hand here. That catalog had no `name`, no `owner`
          # and a source in no dialect Claude Code accepts, so every release
          # republished a catalog that installed nothing — and the version string,
          # the only thing anything checked, was always right.
          FILES=".claude-plugin/marketplace.json .github/plugin/marketplace.json"

          # Authenticated, and NOT because the source is private — it is public,
          # and an unauthenticated read of it works right up until it does not.
          # The anonymous API limit is 60/hr PER IP, and GitHub-hosted runners
          # share egress addresses with every other job on the fleet. The
          # run-scoped token is not a stored secret.
          tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name')"
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "::error::could not read the latest release tag"; exit 1; }

          for f in $FILES; do
            src="packaging/marketplace/$f"
            mkdir -p "$(dirname "$f")"
            # Raw content: no base64 step to fail half-way. Only a 404 means "this
            # tag predates the move"; a rate limit or a server error is a failure,
            # never a reason to keep the current file and report green.
            if ! gh api "repos/$UPSTREAM/contents/$src?ref=$tag" \
                -H 'Accept: application/vnd.github.raw' > "$f.tmp" 2> "$f.err"; then
              if grep -q "HTTP 404" "$f.err"; then
                echo "::notice::$tag has no $src — keeping the current $f"
                rm -f "$f.tmp" "$f.err"
                continue
              fi
              echo "::error::could not read $src at $tag: $(head -1 "$f.err")"
              exit 1
            fi
            rm -f "$f.err"

            # Prove the copy is this release's before it replaces anything.
            jq -e '.name and .owner.name and (.plugins | length > 0)' "$f.tmp" > /dev/null \
              || { echo "::error::$src at $tag lacks name, owner or plugins"; exit 1; }
            mv "$f.tmp" "$f"
          done

          # Then check what is ON DISK, copied or kept: every entry of both
          # catalogs pinned to the latest release. This is what catches a kept
          # catalog that no longer matches — after a rollback, the newer
          # catalogs would otherwise stay pinned to a deleted tag while this run
          # reported "nothing to do".
          for f in $FILES; do
            stale="$(jq -r --arg t "$tag" '[.plugins[] | select(.source.ref? != $t) | .name] | join(", ")' "$f")" \
              || { echo "::error::$f is not a readable catalog"; exit 1; }
            [ -z "$stale" ] || {
              echo "::error::$f pins $stale to a ref other than $tag, the latest release."
              echo "  If $tag was rolled back to, restore the catalogs that match it by hand."
              exit 1
            }
          done

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "catalogs already match $tag — nothing to do"
            exit 0
          fi

          git config user.name "specnaut-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "chore: publish the catalogs of specnaut-cli $tag"
          git push
          echo "✓ catalogs published at $tag"
