# Pull the latest specnaut-cli release into this catalog.
#
# The direction is deliberate. specnaut-cli — a PUBLIC repository — used to hold
# a fine-grained PAT with write access here and bump the catalog at release
# time. A repository publishing a release should not need write access to
# everything that lists it, and the credential enabling that should not sit in a
# public repo at all.
#
# specnaut-cli's Releases API needs no authentication, because the repository is
# public. This workflow reads it and commits to ITSELF with the run's own
# GITHUB_TOKEN, scoped here and expiring with the job. No secret is stored in
# either repo.
#
# The cost is latency: a release lands here within the cron interval rather than
# within seconds. `workflow_dispatch` covers the case where that matters.
name: sync from specnaut-cli

on:
  # Hourly, not every fifteen minutes. This is a SAFETY NET — the release
  # session dispatches both syncs the moment a release lands, so the cron only
  # covers the case where that did not happen. At */15 it produced ~96 no-op
  # runs a day per target, and an Actions history that is 99% "nothing to do"
  # is one where a real failure scrolls past unnoticed.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-cli
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bump the catalog entry to the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CATALOG=".claude-plugin/marketplace.json"
          UPSTREAM="specnaut/specnaut-cli"
          PLUGIN="specnaut-plugin"

          [ -f "$CATALOG" ] || { echo "::error::$CATALOG not found"; exit 1; }

          # Authenticated, and NOT because the source is private — it is public,
          # and an unauthenticated read of it works right up until it does not.
          # The anonymous API limit is 60/hr PER IP, and GitHub-hosted runners
          # share egress addresses with every other job on the fleet, so this
          # call fails on a neighbour's traffic. Observed: run 33792004169 died
          # with `curl: (22) ... error: 403` on exactly that. The run-scoped
          # token costs nothing, is not a stored secret, and moves the call onto
          # the 1000/hr authenticated budget.
          #
          # `gh` rather than `curl -H`: the token then cannot be spelled into a
          # header by hand, and a 4xx surfaces as a non-zero exit instead of a
          # body that `jq` happily reads as `null`.
          tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name')"
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "::error::could not read the latest release tag"; exit 1; }
          version="${tag#v}"

          # Assert the selector matches BEFORE relying on a clean diff. "Nothing
          # to update" and "nothing matched" produce an identical clean tree,
          # and only one of them is success — a name mismatch is what left this
          # catalog fifteen versions behind while every run reported green.
          matches="$(jq --arg n "$PLUGIN" '[.plugins[] | select(.name == $n)] | length' "$CATALOG")"
          if [ "$matches" -ne 1 ]; then
            echo "::error::expected exactly one plugin named '$PLUGIN' in $CATALOG, found $matches."
            echo "  The catalog lists: $(jq -r '[.plugins[].name] | join(", ")' "$CATALOG")"
            exit 1
          fi

          current="$(jq -r --arg n "$PLUGIN" '.plugins[] | select(.name == $n) | .version' "$CATALOG")"
          echo "upstream: $version | catalog: $current"
          if [ "$current" = "$version" ]; then
            echo "already at $version — nothing to do"
            exit 0
          fi

          jq --indent 2 --arg v "$version" --arg n "$PLUGIN" \
            '(.plugins[] | select(.name == $n) | .version) = $v' "$CATALOG" > "$CATALOG.tmp"
          mv "$CATALOG.tmp" "$CATALOG"

          # Read the file back rather than trusting the write.
          written="$(jq -r --arg n "$PLUGIN" '.plugins[] | select(.name == $n) | .version' "$CATALOG")"
          [ "$written" = "$version" ] || { echo "::error::catalog still lists $written after the patch"; exit 1; }

          if [ -z "$(git status --porcelain "$CATALOG")" ]; then
            echo "catalog already matches $tag byte-for-byte — nothing to commit"
            exit 0
          fi

          git config user.name "specnaut-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CATALOG"
          git commit -m "chore: bump $PLUGIN to $version"
          git push
          echo "✓ catalog bumped to $version"
